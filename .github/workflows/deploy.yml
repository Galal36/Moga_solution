name: Deploy Moga Frontend
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: self-hosted
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Install pnpm
        uses: pnpm/action-setup@v4
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
      - name: Build frontend
        run: pnpm run build:client
 
      - name: Deploy to Nginx
        run: |
          mkdir -p /var/www/moga/apps/moga/frontend/dist/spa
          rm -rf /var/www/moga/apps/moga/frontend/dist/spa/*
          cp -r dist/spa/* /var/www/moga/apps/moga/frontend/dist/spa/
          chmod -R 755 /var/www/moga/apps/moga/frontend/dist/spa
